name: AVG_TOKEN Backend Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: avgtoken-backend-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ vars.IMAGE_NAME }}
  NAMESPACE: avgtoken
  DEPLOYMENT: avgtoken-backend
  CONTAINER: backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push ARM64 Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 60s
          command_timeout: 20m
          debug: true
          script: |
            set -Eeuo pipefail

            echo "========== SERVER =========="
            hostname
            whoami

            echo "========== KUBERNETES =========="
            kubectl version --client
            kubectl get nodes -o wide

            echo "========== APPLICATION =========="
            kubectl -n avgtoken get deployment avgtoken-backend

            echo "========== DEPLOY IMAGE =========="
            IMAGE="ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}"
            echo "Deploying: ${IMAGE}"

            echo "========== CURRENT IMAGE =========="
            kubectl -n avgtoken get deployment avgtoken-backend \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
            echo

            echo "========== SET NEW IMAGE =========="
            kubectl -n avgtoken set image \
              deployment/${{ env.DEPLOYMENT }} \
              ${{ env.CONTAINER }}="${IMAGE}"

            echo "========== WAIT FOR ROLLOUT =========="
            if ! kubectl -n avgtoken rollout status \
              deployment/${{ env.DEPLOYMENT }} \
              --timeout=10m; then

              echo "========== ROLLOUT FAILED =========="
              kubectl -n avgtoken get pods -o wide
              kubectl -n avgtoken describe deployment/${{ env.DEPLOYMENT }}
              kubectl -n avgtoken get events \
                --sort-by='.lastTimestamp' | tail -80

              echo "========== ROLLING BACK =========="
              kubectl -n avgtoken rollout undo \
                deployment/${{ env.DEPLOYMENT }}

              echo "========== WAIT FOR ROLLBACK =========="
              kubectl -n avgtoken rollout status \
                deployment/${{ env.DEPLOYMENT }} \
                --timeout=10m

              echo "========== ROLLBACK COMPLETE =========="
              kubectl -n avgtoken get deployment,pod -o wide

              exit 1
            fi

            echo "========== ROLLOUT SUCCESS =========="
            kubectl -n avgtoken get deployment,pod -o wide

            echo "========== VERIFY DEPLOYED IMAGE =========="
            kubectl -n avgtoken get deployment avgtoken-backend \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
            echo

            echo "========== BACKEND DEPLOYMENT SUCCESSFUL =========="

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ AVG_TOKEN Backend Deployment Successful"
          to: "Sanjayvanan03@gmail.com,muthukdm45@gmail.com,deepakavgprimetech@gmail.com"
          from: ${{ secrets.SMTP_USERNAME }}
          html_body: |
            <h2>✅ AVG_TOKEN Backend Deployment Successful</h2>

            <table border="1" cellpadding="8" cellspacing="0">
              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>
              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>
              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>
              <tr>
                <td><b>Image</b></td>
                <td>ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}</td>
              </tr>
              <tr>
                <td><b>Triggered By</b></td>
                <td>${{ github.actor }}</td>
              </tr>
              <tr>
                <td><b>Workflow</b></td>
                <td>${{ github.workflow }}</td>
              </tr>
            </table>

            <br>

            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View GitHub Actions Run
            </a>

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ AVG_TOKEN Backend Deployment Failed"
          to: "Sanjayvanan03@gmail.com,muthukdm45@gmail.com,deepakavgprimetech@gmail.com"
          from: ${{ secrets.SMTP_USERNAME }}
          html_body: |
            <h2>❌ AVG_TOKEN Backend Deployment Failed</h2>

            <table border="1" cellpadding="8" cellspacing="0">
              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>
              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>
              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>
              <tr>
                <td><b>Image</b></td>
                <td>ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}</td>
              </tr>
              <tr>
                <td><b>Triggered By</b></td>
                <td>${{ github.actor }}</td>
              </tr>
              <tr>
                <td><b>Workflow</b></td>
                <td>${{ github.workflow }}</td>
              </tr>
            </table>

            <br>

            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View GitHub Actions Run
            </a>
