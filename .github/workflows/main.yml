name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/otp/apps/AVG_TOKEN_DISTRIBUTION/AVG_Token_Distrubution_Backend

            git pull origin main

            cd ..

            docker compose build holderforge-backend

            docker compose up -d holderforge-backend
